<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>登录 · 帐号空间</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-logo" src="/favicon.svg" alt="" width="56" height="56">
    <p class="eyebrow">ACCOUNT SPACE</p><h1>欢迎回到帐号空间</h1><p class="muted">属于你的帐号，安心归位。</p>
    <form id="login-form">
      <label class="field">用户名<input name="username" autocomplete="username" required maxlength="320" autofocus></label>
      <label class="field" for="password">密码</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button type="button" id="toggle-password" class="quiet" aria-controls="password" aria-pressed="false">显示</button></div>
      <label class="checkbox"><input name="remember" type="checkbox">记住登录 30 天<span class="muted">仅在私人设备上勾选</span></label>
      <p id="login-error" class="form-error" role="alert" hidden></p><button id="login-submit" type="submit" class="primary full-width">登 录</button>
    </form>
    <p class="login-note">这是私人空间，不开放注册。<br>请使用部署时设置的管理员凭据登录。</p>
    <label class="theme-label">外观<select id="theme"><option value="system">跟随系统</option><option value="light">浅色模式</option><option value="dark">深色模式</option></select></label>
  </main>
  <noscript><p class="notice">请启用 JavaScript 以登录。</p></noscript>
</body>
</html>
